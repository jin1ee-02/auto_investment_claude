<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14110e">
<title>Hedge Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">본문으로 건너뛰기</a>
<header class="top">
  <a class="brand" href="#/funds" translate="no">Hedge Insight</a>
  <nav id="nav" aria-label="단계">
    <a href="#/funds" data-tab="funds"><b>1</b> 펀드</a>
    <a href="#/consensus" data-tab="consensus"><b>2</b> 공통 매매</a>
    <a href="#/research" data-tab="research"><b>3</b> 리서치</a>
    <a href="#/trade" data-tab="trade"><b>4</b> 매매</a>
  </nav>
  <div class="top-right">
    <div class="player" id="player" role="group" aria-label="배경 음악" hidden>
      <span class="platter" aria-hidden="true"></span>
      <div class="now"><b id="now-title" translate="no"></b><span id="now-sub"></span></div>
      <button class="icon" id="play" type="button"></button>
      <button class="icon" id="next" type="button" aria-label="다음 곡" title="다음 곡"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5v11l8-5.5zM11.5 2.5h2.5v11h-2.5z"/></svg></button>
      <input class="vol" id="vol" type="range" min="0" max="100" step="1" aria-label="음량" title="음량">
    </div>
    <label class="period">분기 <select id="period"></select></label>
    <button id="refresh" class="btn ghost" title="새 13F 공시 확인">공시 새로고침</button>
  </div>
</header>
<div id="banner" class="banner" role="status" hidden></div>
<main id="view" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal" class="modal" hidden></div>
<div class="yt" inert aria-hidden="true"><div id="yt"></div></div>
<script src="vendor/echarts.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script type="module" src="music.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
